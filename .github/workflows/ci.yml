name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-only-placeholder-not-a-secret
      DATABASE_PATH: /tmp/ci.db
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: tsc
        run: npx tsc --noEmit

      - name: vitest
        run: npx vitest run

      - name: next build
        run: npm run build
        env:
          DATABASE_PATH: /tmp/ci-build.db
