# NAS pull-only deploy (no local Next build).
# Pin a known-good git SHA if :latest is stale, e.g. ghcr.io/psyo1o/strength-lab:ce9cc71
#
# Persistent SQLite: host DATA_DIR → /data/app.db
# pull + up does NOT wipe this folder. pull does not wipe logs. Do not `docker compose down -v`.
services:
  strength-lab:
    image: ghcr.io/psyo1o/strength-lab:latest
    container_name: strength-lab
    restart: unless-stopped
    ports:
      - "7001:3000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/app.db
      MEDIA_PATH: /data/media
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://soopark.myds.me:7001}
    volumes:
      # Host path is outside git-tracked files you might replace, but next to compose.
      # Override with DATA_DIR=/volume1/docker/strength-lab-data if you want it fully outside the repo.
      - ${DATA_DIR:-/volume1/docker/strength-lab/data}:/data
