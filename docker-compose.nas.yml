# NAS pull-only deploy (no local Next build)
services:
  strength-lab:
    image: ghcr.io/psyo1o/strength-lab:latest
    container_name: strength-lab
    restart: unless-stopped
    ports:
      - "7001:3000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/app.db
      MEDIA_PATH: /data/media
      NODE_ENV: production
      PORT: 3000
    volumes:
      - /volume1/docker/strength-lab/data:/data
