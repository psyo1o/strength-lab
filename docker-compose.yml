services:
  strength-lab:
    build: .
    container_name: strength-lab
    restart: unless-stopped
    ports:
      - "7001:3000"
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-change-me-to-a-long-random-secret}
      DATABASE_PATH: /data/app.db
      NODE_ENV: production
      PORT: 3000
    volumes:
      # Synology: replace with /volume1/docker/strength-lab:/data
      - strength-lab-data:/data

volumes:
  strength-lab-data:
