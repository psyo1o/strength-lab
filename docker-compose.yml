services:
  strength-lab:
    build: .
    container_name: strength-lab
    restart: unless-stopped
    ports:
      # Host 7001 → Next.js in the container (PORT=3000).
      # If DSM already uses 7001, change only the left number.
      - "7001:3000"
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-change-me-to-a-long-random-secret}
      DATABASE_PATH: /data/app.db
      MEDIA_PATH: /data/media
      NODE_ENV: production
      PORT: 3000
    volumes:
      # SQLite at /data/app.db. Exercise photos/videos at /data/media (MEDIA_PATH).
      - strength-lab-data:/data
      # Drop local files on the NAS (no Commons hotlink, no TJ Strength clips):
      # mkdir -p /volume1/docker/strength-lab/media
      # cp back_squat.webp /volume1/docker/strength-lab/media/
      # then uncomment:
      # - /volume1/docker/strength-lab/media:/data/media

volumes:
  strength-lab-data:
